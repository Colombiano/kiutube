name: Ubuntu Build Check

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  ubuntu-build-check:
    name: Ubuntu Build Check
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build essentials
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config

      - name: Install dependencies
        # PT: deps do kiutube (reescrita C++20): Lua 5.4 (sol2), taglib,
        #     curl, opus/opusfile, vorbis/ogg, chafa (capa TUI). Qt 6 e
        #     sdbus-c++ são opcionais (stub/FetchContent).
        run: sudo apt install -y liblua5.4-dev libtag1-dev libcurl4-openssl-dev libopus-dev libopusfile-dev libvorbis-dev libogg-dev libchafa-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j

      - name: Run smoke tests
        run: ctest --test-dir build --output-on-failure
